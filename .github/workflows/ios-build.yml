
name: Build HGhub iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Upgrade Tauri CLI
        run: |
          pnpm add -D @tauri-apps/cli@2.12.4
          pnpm tauri --version

      - name: Initialize Tauri iOS project
        run: pnpm tauri ios init --ci

      - name: Build unsigned iOS IPA
        run: |
          set -euo pipefail

          pnpm tauri ios build \
            --no-sign \
            --ci \
            --ignore-version-mismatches

      - name: Find and prepare IPA
        run: |
          set -euo pipefail

          IPA_PATH=$(find src-tauri/gen/apple/build \
            -type f \
            -name "*.ipa" \
            -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "找不到 IPA 檔案"
            find src-tauri/gen/apple -maxdepth 5 -print
            exit 1
          fi

          mkdir -p build
          cp "$IPA_PATH" build/HGhub.ipa

          ls -lh build/HGhub.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-IPA
          path: build/HGhub.ipa
          if-no-files-found: error
          retention-days: 7
