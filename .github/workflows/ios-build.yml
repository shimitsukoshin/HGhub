
name: Build HGhub Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install iOS tools
        run: |
          brew install xcodegen cocoapods

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        run: pnpm ios:init

      - name: Build frontend
        run: pnpm build

      - name: Build unsigned IPA
        run: |
          pnpm tauri ios build \
            --no-sign \
            --ci \
            --features custom-protocol

      - name: Locate and verify IPA
        run: |
          IPA_PATH=$(find src-tauri/gen/apple/build \
            -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA file not found"
            find src-tauri/gen/apple/build -maxdepth 5 -type f || true
            exit 1
          fi

          cp "$IPA_PATH" HGhub-unsigned.ipa

          unzip -t HGhub-unsigned.ipa

          unzip -l HGhub-unsigned.ipa | grep "Payload/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-Unsigned-IPA
          path: HGhub-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
